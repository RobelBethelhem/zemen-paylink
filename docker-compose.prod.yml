# The whole portal on one server: TLS terminator, pages, API, database.
#
# Only Caddy is published. The portal, the API and MySQL talk to each other on
# a private network and none of them is reachable from outside directly.
#
#   bash scripts/install.sh          # first time
#   docker compose -f docker-compose.prod.yml up -d
#
# Named so its volumes never collide with the development stack in the same
# directory. Without this they share one MySQL data directory — and because
# MySQL only applies MYSQL_PASSWORD when it initialises an empty one, the
# second stack to start would silently keep the first one's credentials and
# fail to connect with the password it was given.
name: paylink

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # One port, chosen at install time. Nothing binds 80 or 443, so this can
      # sit alongside whatever else is already on the host.
      - "${PAYLINK_PORT:?set PAYLINK_PORT}:${PAYLINK_PORT}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # certificates and Caddy's own CA live here
      - caddy-config:/config
      # Drop a certificate the bank already owns in ./certs and point
      # PAYLINK_TLS at /certs/… to use it instead of issuing one.
      - ./certs:/certs:ro
      # Optional extra routing, imported by the Caddyfile. Empty by default —
      # an import glob that matches no files is valid, so a deployment that
      # needs none of this carries none of it. See caddy-conf.d/README.md.
      - ./caddy-conf.d:/etc/caddy/conf.d:ro
    environment:
      # host:port — Caddy listens on the port named here.
      #
      # PAYLINK_PUBLIC_SITE adds a second address when a reverse proxy
      # publishes this: that proxy usually passes the original Host through, so
      # Caddy is asked for share.zemenbank.com rather than the internal address
      # and answers 404 to everything unless the name is listed. Written with
      # the port, because an address without one describes 443 and matches
      # nothing arriving here.
      PAYLINK_SITE: ${PAYLINK_HOSTNAME:?set PAYLINK_HOSTNAME}:${PAYLINK_PORT}${PAYLINK_PUBLIC_SITE:+, ${PAYLINK_PUBLIC_SITE}}
      # The host on its own. Caddy needs it without the port for default_sni,
      # which is what lets a browser reach an IP-addressed deployment at all —
      # see the comment in the Caddyfile.
      PAYLINK_HOST: ${PAYLINK_HOSTNAME}
      # The reverse proxy in front of us, so Caddy keeps the forwarded chain
      # rather than replacing it. Must also appear in PAYLINK_TRUSTED_PROXIES.
      # The path a reverse proxy publishes us under, when it keeps that path on
      # the way through. Must match the PAYLINK_BASE_PATH the web image was
      # BUILT with — Next bakes it in, so the two cannot drift at runtime.
      PAYLINK_BASE_PATH: ${PAYLINK_BASE_PATH:-/__no-base-path__}
      PAYLINK_EDGE_PROXIES: ${PAYLINK_EDGE_PROXIES:-127.0.0.1/32}
      PAYLINK_TLS: ${PAYLINK_TLS:-internal}
    depends_on:
      - web
      - api

  web:
    build:
      context: ./web
      args:
        # Only set when a reverse proxy publishes this under a path and keeps
        # that path on the way through. Next bakes asset URLs at build time, so
        # this cannot be changed by restarting — the image has to be rebuilt.
        PAYLINK_BASE_PATH: ${PAYLINK_BASE_PATH:-}
    image: paylink-web:latest
    restart: unless-stopped
    expose:
      - "3000"

  api:
    build: ./api
    image: paylink-api:latest
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env.production
    environment:
      # Binds every interface inside the container so Caddy can reach it. The
      # container is not published, so this exposes nothing.
      PAYLINK_ADDR: "0.0.0.0:8080"
      PAYLINK_DATABASE: "paylink:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@tcp(db:3306)/paylink"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: paylink
      MYSQL_USER: paylink
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    volumes:
      - paylink-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  paylink-mysql:
  caddy-data:
  caddy-config:
